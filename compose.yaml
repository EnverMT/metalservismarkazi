name: metalservicemarkazi

services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${NUXT_PORT}:3000"
    depends_on:
      - backend

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: strapiDB
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      APP_KEYS: ${APP_KEYS}
    ports:
      - "127.0.0.1:${STRAPI_PORT}:${STRAPI_PORT}"
    volumes:
      - backend-uploads:/opt/app/public
    networks:
      - strapi-network
    depends_on:
      - strapiDB

  strapiDB:
    platform: linux/arm64 #for platform error on Apple M1 chips
    restart: unless-stopped
    env_file: .env
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapiDB-data:/var/lib/postgresql/data/
    networks:
      - strapi-network

volumes:
  strapiDB-data:
  backend-uploads:

networks:
  strapi-network:
